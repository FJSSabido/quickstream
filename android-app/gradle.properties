org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Compilar Kotlin dentro del propio proceso de Gradle (sin el "daemon" de Kotlin
# aparte), que es el que fallaba con "Daemon compilation failed: 25.0.2" al
# arrancarse con un Java demasiado nuevo para Kotlin 1.9.
kotlin.compiler.execution.strategy=in-process
