      <stop offset="1" stop-color="#261E3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6D3FE0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6D3FE0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="340" rx="28" fill="url(#bg)"/>
  <ellipse cx="640" cy="210" rx="580" ry="180" fill="url(#glow)"/>
