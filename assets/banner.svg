  <text x="420" y="178" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="#EEF1F5">Quick<tspan fill="#E4FF00">Stream</tspan></text>
  <text x="424" y="236" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" fill="#B79CFF">Tu cámara o tu pantalla, en directo con un enlace</text>
