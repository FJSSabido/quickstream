<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Viendo en directo · QuickStream</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #1a0b2e; color: #f2eaff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    display: flex; flex-direction: column; min-height: 100%;
  }
  header {
    padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
    gap: 10px; border-bottom: 1px solid #2a1450; flex-wrap: wrap;
  }
  header h1 { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 20px; font-weight: 700; margin: 0; color: #e4ff1a; }
  .status {
    font-size: 12px; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
    background: #3b1d6e; color: #b9a6d9;
  }
  .status.live { background: #1c3a2a; color: #4ade80; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  /* Copia del contador de espectadores DENTRO del vídeo: la cabecera queda fuera
     de la pantalla completa, así que ahí solo se ve esta (arriba al centro). */
  .fs-viewer-count {
    display: none; position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 6;
    font-size: 12px; padding: 5px 11px; border-radius: 999px; white-space: nowrap;
    background: rgba(26,11,46,0.7); color: #f2eaff; backdrop-filter: blur(2px);
  }
  :fullscreen .fs-viewer-count.known, :-webkit-full-screen .fs-viewer-count.known { display: block; }
  .status.live::before { content: "● "; }
  .status.off { background: #3a1c1c; color: #f87171; }
  /* Móvil: el vídeo ocupa toda la pantalla y el chat flota encima (ver el
     media query de max-width al final de estos estilos).
     Escritorio (ver el media query de min-width): vídeo y chat lado a lado, el
     chat como columna fija a la derecha, sin que la página entera haga scroll. */
  .main-area {
    display: flex; flex-direction: column; flex: 1; min-height: 0;
  }
  .video-area {
    flex: none; height: 56vh; min-height: 260px; position: relative;
    display: flex; align-items: center; justify-content: center;
    background: #000; overflow: hidden;
  }
  /* En pantalla completa, el navegador ya centra/maximiza el elemento por su
     cuenta — esto es solo un refuerzo para que ocupe TODO el hueco disponible
     en cualquier navegador. */
  .video-area:fullscreen, .video-area:-webkit-full-screen,
  .main-area:fullscreen, .main-area:-webkit-full-screen {
    width: 100vw; height: 100vh; background: #000;
  }
  /* Botón para plegar/desplegar el chat flotante: solo existe en móvil (ver el
     media query de max-width más abajo). */
  .chat-toggle { display: none; }
  /* Chat compartido: lo ve todo el mundo (el anfitrión y cada espectador), como el
     chat de un directo normal. En móvil flota encima del vídeo; en escritorio es
     una columna fija a la derecha (ver los media queries). */
  .chat-panel {
    flex: 1; min-height: 280px; display: flex; flex-direction: column;
    border-top: 1px solid #2a1450; background: #1d0d33;
  }
  /* A partir de aquí consideramos que hay sitio de sobra para poner el chat al
     lado del vídeo en vez de debajo — pensado para PC/escritorio. */
  /* Escritorio: pantalla ancha Y con ratón/trackpad. Un móvil con la opción
     "versión para ordenador" del navegador (o en horizontal, o con la
     pantalla en tamaño pequeño) puede tener más de 900 px de ancho, pero no
     tiene ratón: ese caso se queda con la vista de móvil (chat flotante). */
  @media (min-width: 900px) and (hover: hover), (min-width: 900px) and (pointer: fine) {
    html, body { height: 100%; }
    .wrap { height: 100%; }
    .main-area { flex-direction: row; overflow: hidden; }
    .video-area { flex: 1; height: auto; min-height: 0; }
    .chat-panel {
      flex: none; width: 340px; min-height: 0; height: 100%;
      border-top: none; border-left: 1px solid #2a1450;
    }
  }
  .chat-header {
    padding: 10px 16px; font-size: 12px; font-weight: 600; color: #b9a6d9;
    border-bottom: 1px solid #2a1450; flex: none;
  }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 12px 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .chat-msg {
    max-width: 85%; padding: 8px 12px; border-radius: 14px; font-size: 13.5px;
    line-height: 1.4; word-break: break-word; background: #3b1d6e;
  }
  .chat-msg .chat-name {
    display: block; font-size: 11px; font-weight: 700; opacity: 0.75; margin-bottom: 2px;
  }
  .chat-msg.mine { align-self: flex-end; background: #4a2a85; }
  .chat-msg.host { align-self: flex-start; background: #3b1d6e; border: 1px solid #e4ff1a; }
  .chat-msg.host .chat-name { color: #e4ff1a; }
  .chat-empty { color: #8a78ad; font-size: 12.5px; text-align: center; padding: 10px 0; }
  .chat-form {
    flex: none; display: flex; flex-direction: column; gap: 6px;
    padding: 10px 16px; border-top: 1px solid #2a1450;
  }
  .chat-name-input, .chat-text-input {
    border-radius: 10px; border: 1px solid #4a2a85; background: #22103d; color: #f2eaff;
    font-size: 13.5px; padding: 9px 12px;
  }
  .chat-name-input { font-size: 12px; padding: 7px 12px; }
  .chat-name-input:focus, .chat-text-input:focus { outline: none; border-color: #8b5cf6; }
  .chat-text-input:disabled { opacity: 0.55; cursor: not-allowed; }
  .chat-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-text-input { flex: 1; }
  .chat-send-btn {
    flex: none; width: 42px; border-radius: 10px; border: none;
    background: #8b5cf6; color: white; font-size: 16px; cursor: pointer;
  }
  .chat-send-btn:active { opacity: 0.8; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  /* Cuando hay rotación activa, el tamaño y la posición del vídeo principal los
     calcula JavaScript (layoutVideo) para que quepa bien en cualquier ángulo;
     por eso pasa a position:absolute solo en ese momento (ver layoutVideo). */
  .rotate-btn {
    position: absolute; bottom: 14px; z-index: 6;
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: rgba(26,11,46,0.65); color: #f2eaff; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; backdrop-filter: blur(2px);
  }
  .rotate-btn:active { background: rgba(26,11,46,0.9); }
  #rotateCcwBtn { left: 14px; }
  #rotateBtn { left: 66px; }
  #fullscreenBtn { left: 118px; font-size: 17px; }
  .volume-control {
    position: absolute; bottom: 14px; right: 14px; z-index: 6;
    display: flex; align-items: center; gap: 6px;
    background: rgba(26,11,46,0.65); border-radius: 999px; padding: 6px 14px 6px 6px;
    backdrop-filter: blur(2px);
  }
  .volume-control button {
    width: 32px; height: 32px; border-radius: 50%; border: none; flex: none;
    background: transparent; color: #f2eaff; font-size: 17px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .volume-control button:active { background: rgba(255,255,255,0.15); }
  .volume-control input[type="range"] { width: 80px; accent-color: #c9b6ff; cursor: pointer; }
  /* Iconos de "sin señal": avisan de que quien emite ha apagado el vídeo y/o el
     micrófono, en vez de dejar la imagen congelada sin explicación. La barra
     diagonal (::after) es la misma idea visual que usan Zoom/Meet para "cámara
     apagada" o "micro apagado". */
  .signal-badge {
    position: absolute; top: 14px; z-index: 6;
    width: 40px; height: 40px; border-radius: 50%; border: none;
    background: rgba(26,11,46,0.75); color: #f2eaff; font-size: 18px;
    display: none; align-items: center; justify-content: center;
    backdrop-filter: blur(2px);
  }
  .signal-badge.show { display: flex; }
  .signal-badge::after {
    content: ''; position: absolute; width: 3px; height: 26px;
    background: #f87171; border-radius: 2px; transform: rotate(45deg);
  }
  #noVideoBadge { left: 14px; }
  #noAudioBadge { right: 14px; }
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; text-align: center; padding: 24px;
    background: rgba(16,6,30,0.9);
  }
  .overlay p { max-width: 320px; color: #b9a6d9; line-height: 1.5; margin: 0; font-size: 14px; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid #4a2a85; border-top-color: #c9b6ff;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn {
    padding: 10px 20px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600;
    background: #8b5cf6; color: white; cursor: pointer;
  }
  .btn:active { opacity: 0.8; }
  .pw-input {
    width: 100%; max-width: 260px; padding: 10px 14px; border-radius: 10px;
    border: 1px solid #4a2a85; background: #22103d; color: #f2eaff;
    font-size: 14px; text-align: center;
  }
  .pw-input:focus { outline: none; border-color: #8b5cf6; }
  footer { padding: 10px 16px; font-size: 11px; color: #8a78ad; text-align: center; }
  /* MÓVIL: el chat FLOTA encima del vídeo (como en Instagram/TikTok Live) en vez
     de quedar debajo, para poder seguirlo sin tener que bajar por la página y
     perder de vista la emisión. El vídeo ocupa toda la pantalla; los mensajes
     aparecen abajo sobre un degradado oscuro, con los últimos siempre a la
     vista, y el chat se puede plegar con su botón 💬 si estorba. Los controles
     del vídeo (girar, pantalla completa, volumen) suben a la parte de arriba
     para no chocar con él. */
  /* Móvil: pantalla estrecha, o cualquier pantalla táctil sin ratón (aunque
     sea ancha). Tiene que ser justo lo contrario del media query de escritorio. */
  @media (max-width: 899px), (hover: none) and (pointer: coarse) {
    html, body { height: 100%; overflow: hidden; }
    .wrap { height: 100vh; height: 100dvh; }
    header { padding: 10px 14px; flex-wrap: nowrap; }
    footer { display: none; }
    .main-area { position: relative; }
    .video-area { flex: 1; height: auto; min-height: 0; }
    .rotate-btn { top: 12px; bottom: auto; width: 40px; height: 40px; font-size: 18px; }
    #rotateCcwBtn { left: 12px; }
    #rotateBtn { left: 58px; }
    #fullscreenBtn { left: 104px; font-size: 16px; }
    .volume-control { top: 12px; bottom: auto; right: 12px; padding: 4px 12px 4px 4px; }
    .volume-control input[type="range"] { width: 64px; }
    .signal-badge { top: 62px; }
    /* A pantalla completa, el contador de espectadores baja por debajo de la
       fila de botones: arriba del todo, en muchos móviles, está el agujero de la
       cámara frontal. También respeta la zona segura que indique el móvil. */
    .fs-viewer-count { top: calc(66px + env(safe-area-inset-top, 0px)); }
    #noVideoBadge { left: 12px; }
    #noAudioBadge { right: 12px; }
    .chat-panel {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 7;
      flex: none; min-height: 0; border-top: none;
      background: linear-gradient(to top, rgba(16,6,30,0.88) 0%, rgba(16,6,30,0.55) 65%, rgba(16,6,30,0) 100%);
      padding-bottom: env(safe-area-inset-bottom);
      /* El degradado deja pasar los toques al vídeo; solo los mensajes, el
         formulario y el botón los recogen. */
      pointer-events: none;
    }
    .chat-panel > * { pointer-events: auto; }
    .chat-header, .chat-empty { display: none; }
    .chat-messages {
      flex: none; max-height: 32vh; max-height: 32dvh; padding: 22px 12px 4px; gap: 6px;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px);
      mask-image: linear-gradient(to bottom, transparent 0, #000 22px);
    }
    .chat-msg {
      font-size: 13px; padding: 6px 10px; max-width: 88%;
      background: rgba(42,20,80,0.78); backdrop-filter: blur(4px);
    }
    .chat-msg.mine { background: rgba(74,42,133,0.85); }
    .chat-msg.host { background: rgba(59,29,110,0.88); }
    .chat-form { flex-direction: row; gap: 6px; padding: 6px 12px 10px; border-top: none; }
    .chat-name-input { flex: none; width: 92px; }
    .chat-input-row { flex: 1; min-width: 0; gap: 6px; }
    .chat-name-input, .chat-text-input { background: rgba(26,11,46,0.82); min-width: 0; }
    .chat-toggle {
      display: flex; align-items: center; justify-content: center;
      position: absolute; right: 12px; bottom: calc(100% + 6px);
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: rgba(26,11,46,0.7); color: #f2eaff; font-size: 17px; cursor: pointer;
      backdrop-filter: blur(2px);
    }
    .chat-toggle .unread {
      position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px;
      padding: 0 5px; border-radius: 999px; background: #8b5cf6; color: #fff;
      font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
    }
    .chat-toggle .unread:empty { display: none; }
    .chat-panel.collapsed { background: none; }
    .chat-panel.collapsed .chat-messages, .chat-panel.collapsed .chat-form { display: none; }
    .chat-panel.collapsed .chat-toggle { bottom: calc(12px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>QuickStream</h1>
    <div class="header-right">
      <div id="viewerCount" class="status" title="Espectadores conectados" style="display:none">👁 0</div>
      <div id="status" class="status">Conectando…</div>
    </div>
  </header>
  <div class="main-area">
    <div class="video-area">
      <video id="remoteVideo" playsinline autoplay muted></video>
      <div id="fsViewerCount" class="fs-viewer-count" title="Espectadores conectados">👁 0</div>
      <button id="rotateCcwBtn" class="rotate-btn" type="button" title="Girar 90° a la izquierda" aria-label="Girar a la izquierda">⟲</button>
      <button id="rotateBtn" class="rotate-btn" type="button" title="Girar 90° a la derecha" aria-label="Girar a la derecha">⟳</button>
      <button id="fullscreenBtn" class="rotate-btn" type="button" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
      <div id="volumeControl" class="volume-control">
        <button id="muteBtn" type="button" title="Silenciar / activar sonido" aria-label="Silenciar o activar sonido">🔊</button>
        <input id="volumeSlider" type="range" min="0" max="100" value="100" aria-label="Volumen" />
      </div>
      <div id="noVideoBadge" class="signal-badge" title="Quien emite tiene el vídeo apagado" aria-label="Sin señal de vídeo">🎥</div>
      <div id="noAudioBadge" class="signal-badge" title="Quien emite tiene el micrófono apagado" aria-label="Sin señal de audio">🎙️</div>
      <div id="overlay" class="overlay">
        <div class="spinner"></div>
        <p>Conectando con la señalización…</p>
      </div>
    </div>
    <div class="chat-panel" id="chatPanel">
      <button id="chatToggleBtn" class="chat-toggle" type="button" title="Ocultar chat" aria-label="Ocultar chat">⌄<span class="unread" id="chatUnread"></span></button>
      <div class="chat-header">💬 Chat en directo</div>
      <div id="chatMessages" class="chat-messages">
        <div class="chat-empty" id="chatEmpty">Todavía no hay mensajes — escribe el primero.</div>
      </div>
      <form id="chatForm" class="chat-form">
        <input id="chatNameInput" class="chat-name-input" type="text" maxlength="40" placeholder="Tu nombre (opcional)" autocomplete="off" />
        <div class="chat-input-row">
          <input id="chatTextInput" class="chat-text-input" type="text" maxlength="500" placeholder="Escribe un mensaje…" autocomplete="off" />
          <button id="chatSendBtn" type="submit" class="chat-send-btn" aria-label="Enviar mensaje" title="Enviar">➤</button>
        </div>
      </form>
    </div>
  </div>
  <footer>Conexión directa por WebRTC (peer-to-peer) · el vídeo no pasa por este servidor · el chat sí pasa por el servidor de señalización</footer>
</div>

<script>
(function () {
  const roomId = decodeURIComponent(location.pathname.split('/watch/')[1] || '').replace(/\/$/, '');
  let key = new URLSearchParams(location.search).get('key') || '';
  const statusEl = document.getElementById('status');
  const viewerCountEl = document.getElementById('viewerCount');
  const fsViewerCountEl = document.getElementById('fsViewerCount');
  const overlayEl = document.getElementById('overlay');
  const videoEl = document.getElementById('remoteVideo');
  const rotateBtn = document.getElementById('rotateBtn');
  const rotateCcwBtn = document.getElementById('rotateCcwBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const videoAreaEl = document.querySelector('.video-area');
  const muteBtn = document.getElementById('muteBtn');
  const volumeSlider = document.getElementById('volumeSlider');
  const noVideoBadge = document.getElementById('noVideoBadge');
  const noAudioBadge = document.getElementById('noAudioBadge');
  const chatMessagesEl = document.getElementById('chatMessages');
  const chatEmptyEl = document.getElementById('chatEmpty');
  const chatForm = document.getElementById('chatForm');
  const chatTextInput = document.getElementById('chatTextInput');
  const chatNameInput = document.getElementById('chatNameInput');
  const chatSendBtn = document.getElementById('chatSendBtn');
  const chatPanelEl = document.getElementById('chatPanel');
  const chatToggleBtn = document.getElementById('chatToggleBtn');
  const chatUnreadEl = document.getElementById('chatUnread');
  const mainAreaEl = document.querySelector('.main-area');
  const mobileQuery = window.matchMedia('(max-width: 899px), (hover: none) and (pointer: coarse)');
  let myViewerId = null;
  // El chat solo tiene sentido mientras hay emisión de verdad al otro lado — si
  // el anfitrión ha terminado o todavía no ha empezado, no tiene a quién
  // llegarle el mensaje. Empieza deshabilitado hasta saber que SÍ hay emisión.
  let hostOnline = false;

  // --- Chat compartido (anfitrión + todos los espectadores ven lo mismo) -----
  // Recordamos el nombre entre visitas si el navegador lo permite (localStorage
  // puede fallar en modo privado o si está bloqueado — no pasa nada si falla).
  try { chatNameInput.value = localStorage.getItem('quickstream_chat_name') || ''; } catch (e) { /* ignorar */ }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function appendChatMessage(msg) {
    chatEmptyEl.style.display = 'none';
    const isHost = msg.viewerId === undefined || msg.viewerId === null;
    const isMine = !isHost && msg.viewerId === myViewerId;
    const el = document.createElement('div');
    el.className = 'chat-msg ' + (isHost ? 'host' : (isMine ? 'mine' : ''));
    const name = isHost ? 'Anfitrión' : (msg.name || 'Invitado');
    el.innerHTML = `<span class="chat-name">${escapeHtml(name)}</span>${escapeHtml(msg.text)}`;
    chatMessagesEl.appendChild(el);
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    if (chatPanelEl.classList.contains('collapsed') && !isMine) {
      unreadCount++;
      updateChatToggle();
    }
  }

  // --- Chat flotante plegable (solo móvil) ------------------------------------
  // Con el chat plegado solo queda el botón 💬, con un contador de mensajes
  // nuevos sin leer, para poder ver la emisión completamente despejada.
  let unreadCount = 0;
  function updateChatToggle() {
    const collapsed = chatPanelEl.classList.contains('collapsed');
    chatToggleBtn.firstChild.textContent = collapsed ? '💬' : '⌄';
    const label = collapsed ? 'Mostrar chat' : 'Ocultar chat';
    chatToggleBtn.title = label;
    chatToggleBtn.setAttribute('aria-label', label);
    chatUnreadEl.textContent = collapsed && unreadCount > 0 ? (unreadCount > 99 ? '99+' : String(unreadCount)) : '';
  }
  chatToggleBtn.addEventListener('click', () => {
    const collapsed = chatPanelEl.classList.toggle('collapsed');
    if (!collapsed) {
      unreadCount = 0;
      chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    }
    try { localStorage.setItem('quickstream_chat_collapsed', collapsed ? '1' : '0'); } catch (e) { /* ignorar */ }
    updateChatToggle();
  });
  try {
    if (localStorage.getItem('quickstream_chat_collapsed') === '1') chatPanelEl.classList.add('collapsed');
  } catch (e) { /* ignorar */ }
  updateChatToggle();

  function updateChatAvailability() {
    chatTextInput.disabled = !hostOnline;
    chatSendBtn.disabled = !hostOnline;
    chatTextInput.placeholder = hostOnline
      ? 'Escribe un mensaje…'
      : 'El chat vuelve a estar disponible en cuanto haya emisión en directo';
  }
  updateChatAvailability(); // estado inicial: deshabilitado hasta confirmar que hay emisión

  chatForm.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const text = chatTextInput.value.trim();
    // Doble comprobación aparte de deshabilitar el campo: por si el mensaje ya
    // estaba escrito justo cuando la emisión terminó (el "disabled" no vacía lo
    // que ya había en el campo).
    if (!text || !hostOnline || !ws || ws.readyState !== WebSocket.OPEN) return;
    const name = chatNameInput.value.trim();
    try { localStorage.setItem('quickstream_chat_name', name); } catch (e) { /* ignorar */ }
    ws.send(JSON.stringify({ type: 'chat', text, name }));
    chatTextInput.value = '';
  });

  // --- Iconos de "sin señal" ------------------------------------------------
  // hasVideo/hasAudio son "null" mientras no sabemos con certeza si quien emite
  // tiene el vídeo/micrófono encendidos — hasta que llega o bien el mensaje
  // "state" (la fuente autorizada: lo manda la app en cuanto nos conectamos y
  // cada vez que cambia) o bien, como respaldo, la primera pista de vídeo.
  let knownHasVideo = null;
  let knownHasAudio = null;

  function updateSignalBadges() {
    noVideoBadge.classList.toggle('show', knownHasVideo === false);
    noAudioBadge.classList.toggle('show', knownHasAudio === false);
  }

  function resetSignalBadges() {
    knownHasVideo = null;
    knownHasAudio = null;
    updateSignalBadges();
  }

  // --- Volumen / silencio --------------------------------------------------
  // El vídeo arranca silenciado (atributo "muted") porque los navegadores solo
  // permiten reproducir en automático así — el usuario tiene que interactuar
  // primero para poder oír sonido (ver el intento de pc.ontrack más abajo, con
  // su aviso "Toca para activar el sonido" como último recurso si ni así deja).
  // Este control (botón + regla de volumen) es independiente de esa política
  // inicial: deja silenciar/graduar el sonido en cualquier momento.
  let lastVolume = 1;

  function updateMuteIcon() {
    muteBtn.textContent = (videoEl.muted || videoEl.volume === 0) ? '🔇' : '🔊';
  }

  function unmuteTo(vol) {
    videoEl.muted = false;
    videoEl.volume = vol;
    volumeSlider.value = Math.round(vol * 100);
    if (vol > 0) lastVolume = vol;
    videoEl.play().catch(() => { /* el navegador seguirá pidiendo un toque directo sobre el vídeo */ });
    updateMuteIcon();
    measureOutputLatency();
  }

  muteBtn.addEventListener('click', () => {
    if (videoEl.muted || videoEl.volume === 0) {
      unmuteTo(lastVolume > 0 ? lastVolume : 1);
    } else {
      lastVolume = videoEl.volume;
      videoEl.muted = true;
      updateMuteIcon();
    }
  });

  volumeSlider.addEventListener('input', () => {
    const v = Number(volumeSlider.value) / 100;
    videoEl.volume = v;
    videoEl.muted = v === 0;
    if (v > 0) lastVolume = v;
    updateMuteIcon();
  });

  videoEl.addEventListener('volumechange', updateMuteIcon);

  // --- Girar la vista (útil si el móvil que emite está en una orientación
  // distinta a la que le viene bien a quien mira) -----------------------------
  let rotationDeg = 0;

  function layoutVideo() {
    if (rotationDeg === 0) {
      // Caso normal (sin girar): dejamos que lo resuelva el CSS de siempre
      // (width/height 100% + object-fit: contain), es lo más fiable.
      videoEl.style.position = '';
      videoEl.style.left = '';
      videoEl.style.top = '';
      videoEl.style.width = '100%';
      videoEl.style.height = '100%';
      videoEl.style.transform = '';
      return;
    }

    const vw = videoEl.videoWidth || videoAreaEl.clientWidth || 16;
    const vh = videoEl.videoHeight || videoAreaEl.clientHeight || 9;
    const cw = videoAreaEl.clientWidth;
    const ch = videoAreaEl.clientHeight;
    const swapped = rotationDeg === 90 || rotationDeg === 270;
    // Ajustamos la escala al rectángulo YA girado, para que quepa entero en
    // el hueco disponible sea cual sea el ángulo.
    const fitW = swapped ? vh : vw;
    const fitH = swapped ? vw : vh;
    const scale = Math.min(cw / fitW, ch / fitH);

    videoEl.style.position = 'absolute';
    videoEl.style.left = '50%';
    videoEl.style.top = '50%';
    videoEl.style.width = (vw * scale) + 'px';
    videoEl.style.height = (vh * scale) + 'px';
    videoEl.style.transform = `translate(-50%, -50%) rotate(${rotationDeg}deg)`;
  }

  // Sentido horario (derecha) y antihorario (izquierda) — cada toque suma o
  // resta 90°, tantas veces como haga falta hasta encontrar el ángulo correcto.
  rotateBtn.addEventListener('click', () => {
    rotationDeg = (rotationDeg + 90) % 360;
    layoutVideo();
  });
  rotateCcwBtn.addEventListener('click', () => {
    rotationDeg = (rotationDeg + 270) % 360; // +270 == -90 en módulo 360, sin negativos
    layoutVideo();
  });
  videoEl.addEventListener('loadedmetadata', layoutVideo);
  window.addEventListener('resize', layoutVideo);
  window.addEventListener('orientationchange', layoutVideo);

  // --- Pantalla completa (maximizar/minimizar) --------------------------------
  // Maximiza el área de vídeo (con sus controles encima, incluido el chat NO
  // entra en pantalla completa a propósito: en pantalla completa se prioriza
  // ver el vídeo lo más grande posible). Con prefijo "webkit" para Safari, que
  // todavía no soporta la API sin prefijo en todas sus versiones.
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function updateFullscreenIcon() {
    const fs = isFullscreen();
    fullscreenBtn.textContent = fs ? '✕' : '⛶';
    const label = fs ? 'Salir de pantalla completa' : 'Pantalla completa';
    fullscreenBtn.title = label;
    fullscreenBtn.setAttribute('aria-label', label);
  }

  fullscreenBtn.addEventListener('click', () => {
    if (!isFullscreen()) {
      // En móvil, a pantalla completa va el vídeo JUNTO con el chat flotante
      // (que se puede plegar con su botón si se quiere el vídeo despejado). En
      // escritorio, solo el vídeo, como siempre.
      const target = mobileQuery.matches ? mainAreaEl : videoAreaEl;
      const req = target.requestFullscreen || target.webkitRequestFullscreen;
      if (req) req.call(target);
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    }
  });

  // --- Sincronización audio / imagen -------------------------------------------
  // WebRTC ya sincroniza por sí solo sonido e imagen según el momento en que se
  // captó cada uno en el móvil, y eso no depende de la cámara, la resolución, la
  // red ni lo que tarde en codificarse. Pero el micrófono del móvil entrega el
  // sonido tarde (su propio búfer: ~270-290 ms con cualquier cámara, MIC_LATENCY_MS, medido con destellos
  // y pitidos grabados por el móvil), y además este dispositivo tarda un poco en
  // sacar el sonido por altavoces/auriculares. Así que la IMAGEN se muestra ese
  // tiempo después de recibirla: cada fotograma pasa por una pequeña cola antes
  // de llegar al <video> (MediaStreamTrackProcessor/Generator, de Chrome/Edge).
  // En navegadores sin eso, queda solo la sincronización de WebRTC.
  const MIC_LATENCY_MS = 285;
  const canDelayFrames = typeof MediaStreamTrackProcessor !== 'undefined' &&
    typeof MediaStreamTrackGenerator !== 'undefined';
  const syncDebug = /[?&]debug=sync(&|$)/.test(location.search);
  window.__qsSync = { history: [] }; // para inspeccionar la sincronización

  // Lo que tarda ESTE dispositivo en sacar el sonido por altavoces o auriculares
  // (en Bluetooth puede pasar de 200 ms). Se mide al tocar Reproducir.
  let outputLatencyMs = 40; // valor típico mientras no se pueda medir
  let outputLatencyMeasured = false;
  async function measureOutputLatency() {
    if (outputLatencyMeasured || typeof AudioContext === 'undefined') return;
    outputLatencyMeasured = true;
    try {
      const ac = new AudioContext();
      await ac.resume();
      await new Promise((r) => setTimeout(r, 300)); // da tiempo a que lo calcule
      const s = (ac.outputLatency || 0) + (ac.baseLatency || 0);
      if (s > 0 && s < 1) outputLatencyMs = Math.round(s * 1000);
      ac.close();
    } catch (e) { /* nos quedamos con el valor típico */ }
  }

  // Compartiendo PANTALLA la imagen ya sale del móvil con bastante retraso (la
  // captura de pantalla tarda más que el micrófono), así que el sonido no llega
  // tarde y no hay que retrasar la imagen: con el retraso de la cámara el sonido
  // se adelantaba ~340 ms (medido con destellos y pitidos en el propio móvil).
  // La app dice qué fuente emite en el mensaje 'state' (msg.source).
  const SCREEN_AUDIO_LAG_MS = -55;
  let videoSource = null;

  function videoDelayMs() {
    const lag = videoSource === 'SCREEN' ? SCREEN_AUDIO_LAG_MS : MIC_LATENCY_MS;
    return Math.max(0, lag + outputLatencyMs);
  }

  // Devuelve una pista de vídeo que es la recibida, pero videoDelayMs() más tarde.
  let stopFrameDelay = null;
  function delayVideoTrack(track) {
    if (stopFrameDelay) stopFrameDelay();
    const processor = new MediaStreamTrackProcessor({ track });
    const generator = new MediaStreamTrackGenerator({ kind: 'video' });
    const reader = processor.readable.getReader();
    const writer = generator.writable.getWriter();
    const queue = [];
    let stopped = false;
    let timer = null;

    function pump() {
      timer = null;
      const now = performance.now();
      while (queue.length && queue[0].at <= now) {
        const { frame } = queue.shift();
        writer.write(frame).catch(() => { try { frame.close(); } catch (e) { /* ignorar */ } });
      }
      if (queue.length && !stopped) timer = setTimeout(pump, Math.max(1, queue[0].at - now));
    }

    (async () => {
      while (!stopped) {
        let result;
        try { result = await reader.read(); } catch (e) { break; }
        if (result.done) break;
        queue.push({ frame: result.value, at: performance.now() + videoDelayMs() });
        // Por si la pestaña se queda en segundo plano y los temporizadores se
        // frenan: no acumular más de ~3 s de imagen.
        while (queue.length > 90) queue.shift().frame.close();
        if (syncDebug && Math.random() < 0.05) {
          const h = window.__qsSync.history;
          h.push({ t: Date.now(), delay: videoDelayMs(), queued: queue.length });
          if (h.length > 300) h.shift();
        }
        if (!timer) pump();
      }
    })();

    stopFrameDelay = () => {
      stopped = true;
      clearTimeout(timer);
      queue.splice(0).forEach(({ frame }) => frame.close());
      try { reader.cancel(); } catch (e) { /* ignorar */ }
      try { generator.stop(); } catch (e) { /* ignorar */ }
      stopFrameDelay = null;
    };
    return generator;
  }

  document.addEventListener('fullscreenchange', () => { updateFullscreenIcon(); layoutVideo(); });
  document.addEventListener('webkitfullscreenchange', () => { updateFullscreenIcon(); layoutVideo(); });

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }

  function showOverlay(html) {
    overlayEl.style.display = 'flex';
    overlayEl.innerHTML = html;
  }
  function hideOverlay() {
    overlayEl.style.display = 'none';
  }

  if (!roomId) {
    setStatus('Sin sala', 'off');
    showOverlay('<p>Falta el identificador de la sala en la URL.</p>');
    return;
  }

  // Empezamos solo con STUN (válido para conexión directa en redes normales);
  // loadTurnIceServers() añade un TURN de verdad antes de conectar, si el
  // servidor lo tiene configurado (ver /turn-credentials en server.js) — sin
  // TURN, en redes muy restrictivas (datos móviles, wifis corporativas) la
  // conexión puede quedarse sin establecerse nunca, sin ningún error visible.
  let rtcConfig = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]
  };

  async function loadTurnIceServers() {
    try {
      const resp = await fetch('/turn-credentials');
      const data = await resp.json();
      if (Array.isArray(data.iceServers) && data.iceServers.length > 0) {
        rtcConfig = { iceServers: [...rtcConfig.iceServers, ...data.iceServers] };
      }
    } catch (e) {
      // Sin TURN seguimos con los STUN de siempre — no bloqueamos la conexión por esto.
    }
  }

  let pc = null;
  let remoteStream = new MediaStream();
  let ws = null;
  let reconnectTimer = null;

  // Latido: mientras se ve la emisión, por este WebSocket apenas pasa nada (el
  // vídeo va directo desde el móvil), y los proxies cortan las conexiones que
  // llevan mucho rato en silencio. Un mensajito cada 25 s lo evita.
  setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      try { ws.send('{"type":"ping"}'); } catch (e) { /* ignorar */ }
    }
  }, 25000);
  let gotStream = false;
  // true mientras se espera a que el usuario escriba la contraseña: en ese
  // estado NO reconectamos solos cada 2,5s (nos quedaríamos reintentando con
  // una contraseña que ya sabemos que está mal/vacía).
  let awaitingPassword = false;

  // --- Contraseña de la sala ---------------------------------------------
  // El enlace que comparte quien emite no lleva la contraseña incrustada (por
  // seguridad, se da aparte). Si la sala tiene contraseña, el servidor
  // rechaza la conexión con el mensaje exacto "Contraseña incorrecta." — en
  // ese caso, en vez de solo mostrar el error, pedimos la contraseña aquí
  // mismo y reintentamos la conexión con lo que escriba el usuario.
  function showPasswordPrompt(message) {
    awaitingPassword = true;
    setStatus('Con contraseña', 'off');
    showOverlay(
      '<p>' + message + '</p>' +
      '<input id="pwInput" type="password" placeholder="Contraseña de la sala" class="pw-input" autocomplete="off" />' +
      '<button class="btn" id="pwSubmit">Entrar</button>'
    );
    const input = document.getElementById('pwInput');
    const submitBtn = document.getElementById('pwSubmit');
    const trySubmit = () => {
      key = input.value;
      awaitingPassword = false;
      showOverlay('<div class="spinner"></div><p>Conectando…</p>');
      connect();
    };
    submitBtn.onclick = trySubmit;
    input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') trySubmit(); });
    input.focus();
  }

  function wsUrl() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const q = new URLSearchParams({ room: roomId, role: 'viewer', key });
    return `${proto}//${location.host}/ws?${q.toString()}`;
  }

  function connect() {
    clearTimeout(reconnectTimer);
    setStatus('Conectando…');
    showOverlay('<div class="spinner"></div><p>Conectando con la señalización…</p>');
    resetSignalBadges(); // no sabemos el estado de vídeo/audio hasta que llegue el nuevo "state"

    ws = new WebSocket(wsUrl());

    ws.onopen = () => { /* esperar mensajes del servidor */ };

    ws.onmessage = async (ev) => {
      const msg = JSON.parse(ev.data);

      if (msg.type === 'error') {
        if (msg.message === 'Contraseña incorrecta.') {
          const wasEmpty = !key;
          ws.close();
          showPasswordPrompt(
            wasEmpty
              ? 'Esta sala está protegida con contraseña.'
              : 'Contraseña incorrecta. Inténtalo de nuevo.'
          );
          return;
        }
        setStatus('Error', 'off');
        showOverlay('<p>' + (msg.message || 'No se pudo conectar.') + '</p>');
        ws.close();
        return;
      }

      if (msg.type === 'viewer-registered') {
        myViewerId = msg.viewerId || myViewerId;
        hostOnline = !!msg.hostOnline;
        updateChatAvailability();
        if (!msg.hostOnline) {
          setStatus('Esperando…');
          showOverlay('<div class="spinner"></div><p>La emisión todavía no ha empezado. Esta página se conectará automáticamente en cuanto arranque.</p>');
        }
        return;
      }

      if (msg.type === 'host-offline') {
        gotStream = false;
        hostOnline = false;
        updateChatAvailability();
        setStatus('Sin emisión', 'off');
        showOverlay('<p>La emisión ha terminado o se ha desconectado.</p>');
        resetSignalBadges();
        if (pc) { pc.close(); pc = null; }
        return;
      }

      if (msg.type === 'viewer-count') {
        const n = Number(msg.count) || 0;
        viewerCountEl.textContent = '👁 ' + n;
        viewerCountEl.title = n === 1 ? '1 espectador conectado' : n + ' espectadores conectados';
        viewerCountEl.style.display = '';
        fsViewerCountEl.textContent = viewerCountEl.textContent;
        fsViewerCountEl.title = viewerCountEl.title;
        fsViewerCountEl.classList.add('known');
        return;
      }

      if (msg.type === 'state') {
        // Mensaje autorizado desde la app: dice si hay vídeo y/o audio saliendo
        // AHORA MISMO, tanto al conectarnos como cada vez que cambia en caliente.
        knownHasVideo = !!msg.hasVideo;
        knownHasAudio = !!msg.hasAudio;
        if (msg.source) videoSource = msg.source;
        updateSignalBadges();
        return;
      }

      if (msg.type === 'chat') {
        appendChatMessage(msg);
        return;
      }

      if (msg.type === 'offer') {
        // Recibir una oferta es prueba de que el anfitrión SÍ está emitiendo ahora
        // mismo (por si 'viewer-registered' llegó con hostOnline=false porque nos
        // conectamos justo antes de que empezara) — reactiva el chat aquí también.
        hostOnline = true;
        updateChatAvailability();
        setupPeerConnection();
        await pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp });
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }));
        return;
      }

      if (msg.type === 'candidate' && msg.candidate) {
        if (pc) {
          try { await pc.addIceCandidate(msg.candidate); } catch (e) { /* ignorar */ }
        }
        return;
      }
    };

    ws.onclose = () => {
      if (awaitingPassword) return; // esperando a que el usuario escriba la contraseña
      if (!gotStream) {
        setStatus('Reconectando…', 'off');
      }
      reconnectTimer = setTimeout(connect, 2500);
    };

    ws.onerror = () => { ws.close(); };
  }

  function setupPeerConnection() {
    if (pc) pc.close();
    remoteStream = new MediaStream();
    if (stopFrameDelay) stopFrameDelay();
    pc = new RTCPeerConnection(rtcConfig);
    if (syncDebug) window.__qsSync.pc = pc;

    // Safari/WebKit tiene un fallo conocido con conexiones que SOLO reciben
    // (como esta página: nunca manda cámara ni micrófono propios) — a veces no
    // llega a generar candidatos ICE ni completa la conexión si no hay ya
    // "transceivers" declarados ANTES de procesar la oferta que llega del móvil.
    // En Chrome/Firefox no hace falta y no molesta declararlo igualmente: es
    // justo lo que ya iba a pasar en cuanto llegara la oferta con vídeo/audio.
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });

    pc.onicecandidate = (ev) => {
      if (ev.candidate && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'candidate', candidate: ev.candidate }));
      }
    };

    let needsPlayGesture = false;
    let stuckTimer = null;

    pc.ontrack = (ev) => {
      // OJO: "ontrack" solo dice que WebRTC ha NEGOCIADO una pista (por la SDP),
      // NO que los datos de vídeo/audio estén llegando de verdad — eso puede
      // fallar aparte si la conexión ICE no consigue atravesar la red (típico en
      // redes restrictivas sin servidor TURN). Por eso aquí NO marcamos "En
      // directo" todavía: eso se hace más abajo, en onconnectionstatechange,
      // que es la señal real de que hay conexión de verdad.
      gotStream = true;
      // Audio e imagen se juntan en un stream para el elemento <video>,
      // sustituyendo la pista anterior del mismo tipo si la hubiera; la imagen
      // pasa antes por la cola que la retrasa (ver delayVideoTrack). Se crea un
      // stream NUEVO y se vuelve a asignar cada vez: si solo se añadiera la pista
      // al stream que el <video> ya está reproduciendo, Chrome/Brave pueden no
      // enterarse de ella (pasaba con el audio: no sonaba).
      let shown = ev.track;
      if (ev.track.kind === 'video' && canDelayFrames) {
        try { shown = delayVideoTrack(ev.track); } catch (e) { shown = ev.track; }
      }
      const tracks = remoteStream.getTracks().filter((t) => t.kind !== ev.track.kind);
      tracks.push(shown);
      remoteStream = new MediaStream(tracks);
      videoEl.srcObject = remoteStream;
      if (knownHasVideo === null && ev.track.kind === 'video') {
        knownHasVideo = true;
        updateSignalBadges();
      }
      layoutVideo();
      videoEl.play().catch(() => {
        needsPlayGesture = true;
        showOverlay('<p>Toca para activar el sonido y reproducir</p><button class="btn" id="playBtn">Reproducir</button>');
        document.getElementById('playBtn').onclick = () => {
          needsPlayGesture = false;
          unmuteTo(lastVolume > 0 ? lastVolume : 1);
          hideOverlay();
        };
      });
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'connected') {
        clearTimeout(stuckTimer);
        setStatus('En directo', 'live');
        if (!needsPlayGesture) hideOverlay();
        return;
      }
      if (pc.connectionState === 'connecting') {
        // Si tarda demasiado en conectar de verdad, lo más probable es una red
        // muy restrictiva que necesitaría un servidor TURN (ver README) — mejor
        // avisar de eso que dejar el spinner girando sin explicación.
        clearTimeout(stuckTimer);
        stuckTimer = setTimeout(() => {
          if (pc.connectionState !== 'connected') {
            showOverlay(
              '<div class="spinner"></div>' +
              '<p>La conexión está tardando más de lo normal. Puede deberse a una red muy ' +
              'restrictiva (WiFi corporativa, ciertas redes 4G/5G) — seguimos intentándolo.</p>'
            );
          }
        }, 8000);
      }
      if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
        clearTimeout(stuckTimer);
        needsPlayGesture = false;
        gotStream = false;
        setStatus('Reconectando…', 'off');
      }
    };
  }

  // Permitir activar sonido tocando el vídeo (política de autoplay de los navegadores),
  // además del botón/regla de volumen de arriba.
  videoEl.addEventListener('click', () => {
    if (videoEl.muted) unmuteTo(lastVolume > 0 ? lastVolume : 1);
  });

  // Pedimos primero el TURN (si lo hay) y solo entonces conectamos — así, para
  // cuando llegue la oferta del móvil, rtcConfig ya está completo. El propio
  // fetch tiene su try/catch, así que esto nunca se queda colgado esperando.
  loadTurnIceServers().then(connect);
})();
</script>
</body>
</html>
