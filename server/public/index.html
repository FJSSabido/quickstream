<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QuickStream</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #1a0b2e; color: #f2eaff; display: flex; align-items: center; justify-content: center;
    height: 100vh; margin: 0; text-align: center; padding: 24px; box-sizing: border-box; }
  div { max-width: 420px; }
  h1 { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 30px; color: #e4ff1a; }
  p { color: #b9a6d9; line-height: 1.6; font-size: 14px; }
  code { background: #2a1450; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div>
  <h1>QuickStream</h1>
  <p>Este es el servidor de señalización. No hace falta abrir nada aquí:
  la app de Android te dará un enlace del tipo<br><code>/watch/abc123</code>
  que puedes compartir para que otros vean tu cámara o pantalla en directo.</p>
</div>
</body>
</html>
